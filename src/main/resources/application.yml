
spring:
  application:
    name: chatbot
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-dummy-key-for-startup}
      chat:
        options:
          model: qwen3.6-flash-2026-04-16

  datasource:
    url: jdbc:mysql://localhost:3306/chat_bot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  type-aliases-package: com.chatbot.dao.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# JWT
jwt:
  secret: Y2hhdGJvdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi0yMDI2
  expiration: 7200

logging:
  level:
    com.chatbot: DEBUG
    org.springframework.security: WARN

# RAG配置
chatbot:
  rag:
    enabled: true
    top-k: 5
    chunk-size: 1000
    chunk-overlap: 100
  knowledge:
    upload-path: ./uploads/knowledge
  ai:
    mock-enabled: true
